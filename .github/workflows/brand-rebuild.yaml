# البناء والنشر التلقائي
#
# يعمل عند أي تعديل في الأداة على فرع main: الهوية (branding/)، الترجمات والإعدادات (config/)،
# الكود (functions/، scripts/، xaml/) أو أدوات البناء (tools/).
# 1. يطبّق branding/brand.json على ملفات المصدر (tools/Apply-Brand.ps1) ويحفظها في main.
# 2. يبني winutil.ps1 (Compile.ps1) وينشره على فرع release، فيصل للمستخدمين عبر أمر التشغيل.
# 3. يحدّث صفحات الموقع على gh-pages (لا ألوانه): مكتبة التحسينات والبرامج، وسجل الإصدارات،
#    والإصدار وبصمة SHA256، وخريطة الموقع (tools/site/build_site.py).
name: Build and publish

on:
  push:
    branches: [main]
    paths:
      - "branding/**"
      - "config/**"
      - "functions/**"
      - "scripts/**"
      - "xaml/**"
      - "tools/**"
      - "Compile.ps1"
  workflow_dispatch:

permissions:
  contents: write

# حفظان متتاليان لا يعملان في الوقت نفسه: الثاني ينتظر الأول.
concurrency:
  group: brand-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # التاريخ الكامل لسجل الإصدارات في الموقع

      - name: Apply branding to source files
        shell: pwsh
        run: ./tools/Apply-Brand.ps1

      - name: Commit updated source files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A config/themes.json functions/private
          if git diff --cached --quiet; then
            echo "Source files already match brand.json"
          else
            git commit -m "تطبيق الهوية من branding/brand.json"
            git push origin HEAD:main
          fi

      - name: Compile winutil.ps1
        shell: pwsh
        run: ./Compile.ps1

      - name: Publish winutil.ps1 to the release branch
        run: |
          git fetch origin release
          git worktree add -B release ../release origin/release
          cp winutil.ps1 ../release/winutil.ps1
          cd ../release
          git add winutil.ps1
          if git diff --cached --quiet; then
            echo "winutil.ps1 unchanged"
          else
            git commit -m "إعادة بناء الملف المجمّع بعد تغيير الهوية"
            git push origin release
          fi

      # هوية الموقع مستقلة عن هوية الأداة: ألوان الموقع وشعاره في gh-pages
      # (assets/css/style.css)، ولا يغيّرها brand.json. هنا تُولَّد الصفحات فقط.
      - name: Regenerate website pages on gh-pages
        shell: pwsh
        run: |
          git fetch origin gh-pages
          git worktree add -B gh-pages ../site origin/gh-pages

          # الصفحات المولّدة: التحسينات، البرامج، سجل الإصدارات، البيانات، sitemap
          python3 tools/site/build_site.py --out ../site --winutil winutil.ps1
          if ($LASTEXITCODE -ne 0) { throw "build_site.py failed" }

          Set-Location ../site
          git add -A assets/data tweaks apps changelog sitemap.xml robots.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "تحديث الموقع تلقائيًا بعد البناء"
            git push origin gh-pages
          } else {
            Write-Host "Website already up to date"
          }
