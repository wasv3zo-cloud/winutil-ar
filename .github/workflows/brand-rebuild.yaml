# إعادة البناء بعد تغيير الهوية البصرية
#
# يعمل تلقائيًا عندما تحفظ صفحة «استوديو التصميم» ملفًا داخل branding/ على فرع main.
# 1. يطبّق branding/brand.json على ملفات المصدر (tools/Apply-Brand.ps1) ويحفظها في main.
# 2. يبني winutil.ps1 (Compile.ps1) وينشره على فرع release، فيصل للمستخدمين عبر أمر التشغيل.
# 3. يحدّث لون الموقع وشعاره على فرع gh-pages.
name: Brand rebuild

on:
  push:
    branches: [main]
    paths: ["branding/**"]
  workflow_dispatch:

permissions:
  contents: write

# حفظان متتاليان لا يعملان في الوقت نفسه: الثاني ينتظر الأول.
concurrency:
  group: brand-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply branding to source files
        shell: pwsh
        run: ./tools/Apply-Brand.ps1

      - name: Commit updated source files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A config/themes.json functions/private
          if git diff --cached --quiet; then
            echo "Source files already match brand.json"
          else
            git commit -m "تطبيق الهوية من branding/brand.json"
            git push origin HEAD:main
          fi

      - name: Compile winutil.ps1
        shell: pwsh
        run: ./Compile.ps1

      - name: Publish winutil.ps1 to the release branch
        run: |
          git fetch origin release
          git worktree add -B release ../release origin/release
          cp winutil.ps1 ../release/winutil.ps1
          cd ../release
          git add winutil.ps1
          if git diff --cached --quiet; then
            echo "winutil.ps1 unchanged"
          else
            git commit -m "إعادة بناء الملف المجمّع بعد تغيير الهوية"
            git push origin release
          fi

      - name: Update website colors and logo on gh-pages
        shell: pwsh
        run: |
          git fetch origin gh-pages
          git worktree add -B gh-pages ../site origin/gh-pages
          $brand = Get-Content branding/brand.json -Raw | ConvertFrom-Json
          $hex = '^#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$'
          $accent = [string]$brand.colors.ProgressBarForegroundColor
          $link = [string]$brand.colors.LinkForegroundColor
          if ($accent -notmatch $hex -or $link -notmatch $hex) { throw "Invalid accent or link color" }

          $css = @(
            "/* Generated by .github/workflows/brand-rebuild.yaml from branding/brand.json. Do not edit by hand. */",
            ":root { --brand: $accent; --brand-soft: $link; }",
            ":root[data-theme=`"light`"] { --brand: $accent; }"
          )
          if ($brand.logoImage) {
            Copy-Item -LiteralPath ([string]$brand.logoImage) ../site/assets/logo.png -Force
            $css += ".brand__mark { background: center / cover no-repeat url(`"../logo.png`"); }"
            $css += ".brand__mark svg { visibility: hidden; }"
          } elseif (Test-Path ../site/assets/logo.png) {
            Remove-Item ../site/assets/logo.png
          }
          Set-Content -Path ../site/assets/css/brand.css -Value $css -Encoding utf8NoBOM

          Set-Location ../site
          git add -A assets
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "تحديث ألوان الموقع وشعاره من branding/brand.json"
            git push origin gh-pages
          } else {
            Write-Host "Website already up to date"
          }
